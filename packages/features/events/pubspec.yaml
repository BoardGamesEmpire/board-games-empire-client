name: events
description: "Events feature — the hydrate and the events overview (#496, #497)"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  # The shared game filters the Offer games page narrows the collection with
  # (#516): one of the two feature packages another may depend on, with
  # `user_search`.
  game_filters:
    path: ../game_filters
  hydration:
    path: ../../core/hydration
  interfaces:
    path: ../../core/interfaces
  intl: ^0.20.2
  models:
    path: ../../core/models
  network_interface:
    path: ../../network/network_interface
  observability:
    path: ../../core/observability
  reactive_forms: ^18.1.1
  # Design system (#165). `ui` carries the shared widgets, `ui_tokens` the
  # scale; both declared directly because this package imports from both.
  ui:
    path: ../../ui/widgets
  ui_tokens:
    path: ../../ui/tokens
  # The shared user search the create form picks invitees with (#499): one
  # of the two feature packages another may depend on, with `game_filters`.
  user_search:
    path: ../user_search

dev_dependencies:
  # Shared widget-test helpers: viewport sizing for the overview's
  # narrow-window and large-text checks.
  bge_test_support:
    path: ../../testing/support
  bloc_test: ^10.0.0
  # A real container for the hydrate installer's tests. Dev-only: nothing
  # under `lib/` names `di` — the installer takes the `DependencyContainer`
  # abstraction from `interfaces`. Same shape as `game_collection`'s.
  di:
    path: ../../core/di
  # The real repository over an in-memory database, for the hydrator's tests.
  # Dev-only, and the reason this package exists: `drift_storage` cannot see
  # `network_interface`, so the hydrate could not live there. The purge's
  # window is applied in that database's SQL, so a fake could not prove what
  # a pass removes.
  drift_storage:
    path: ../../storage/drift_storage
  flutter_test:
    sdk: flutter
  l10n_test_support:
    path: ../../testing/l10n
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

name: feedback
description: "User-initiated feedback feature — compose form for bug / feature-request reports (#107)"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  observability:
    path: ../../core/observability

  reactive_forms: ^18.1.1
  intl: ^0.20.2
  # Design system (#165). `ui` carries the shared widgets, `ui_tokens` the
  # scale — both declared directly because this package imports from both.
  ui:
    path: ../../ui/widgets
  ui_tokens:
    path: ../../ui/tokens

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.2.0
  l10n_test_support:
    path: ../../testing/l10n

flutter:
  generate: true
  uses-material-design: true

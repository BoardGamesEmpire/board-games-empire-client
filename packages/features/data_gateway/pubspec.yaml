name: data_gateway
description: "DataGateway admin feature: list, add, edit, delete, connect and disconnect the server's DataGateways, and review each one's interview, lists, capabilities and language links"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  interfaces:
    path: ../../core/interfaces
  intl: ^0.20.2
  models:
    path: ../../core/models
  network_interface:
    path: ../../network/network_interface
  observability:
    path: ../../core/observability
  reactive_forms: ^18.1.1
  # Design system (#165). `ui` carries the shared widgets, `ui_tokens` the
  # scale — both declared directly because this package imports from both.
  ui:
    path: ../../ui/widgets
  ui_tokens:
    path: ../../ui/tokens

dev_dependencies:
  # `FakeCallerAccessRepository` (#456), the session's access set by hand.
  bge_test_support:
    path: ../../testing/support
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  l10n_test_support:
    path: ../../testing/l10n

flutter:
  generate: true
  uses-material-design: true

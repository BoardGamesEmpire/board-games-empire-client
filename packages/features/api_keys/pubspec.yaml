name: api_keys
description: "Your API keys on a server (#1028): list them, filtered by status, with how many permissions each holds and the highest risk among them"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  interfaces:
    path: ../../core/interfaces
  intl: ^0.20.2
  meta: ^1.12.0
  models:
    path: ../../core/models
  # The remote comes in as a parameter. Nothing under `lib/` names `di`.
  network_interface:
    path: ../../network/network_interface
  # The expiry's custom days field, and the create and edit forms (#1028).
  reactive_forms: ^18.1.1
  ui:
    path: ../../ui/widgets
  ui_tokens:
    path: ../../ui/tokens

dev_dependencies:
  bge_test_support:
    path: ../../testing/support
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  l10n_test_support:
    path: ../../testing/l10n
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

name: auth
description: "Authentication feature — Bloc, states, and events"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  interfaces:
    path: ../../core/interfaces
  intl: ^0.20.2
  models:
    path: ../../core/models
  observability:
    path: ../../core/observability
  reactive_forms: ^18.1.1
  ui:
    path: ../../ui/widgets
  ui_tokens:
    path: ../../ui/tokens

dev_dependencies:
  # Shared test helpers (#354, #213, #257): canned Dio transports and/or
  # widget-test viewport, semantics and scroll-geometry helpers.
  bge_test_support:
    path: ../../testing/support
  bloc_test: ^10.0.0
  # `replayThenForward`, for the connectivity fake in the offline-restore
  # tests (#102). Dev-only: nothing under `lib/` names `di`. Same shape as
  # `household`'s and `collection`'s dev dependency on it.
  di:
    path: ../../core/di
  flutter_test:
    sdk: flutter
  l10n_test_support:
    path: ../../testing/l10n
  logging: ^1.3.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

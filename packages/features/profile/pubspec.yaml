name: profile
description: "Your own profile: read and edit it, its reach and whether search finds you (#547)"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  models:
    path: ../../core/models
  network_interface:
    path: ../../network/network_interface
  reactive_forms: ^18.1.1
  ui:
    path: ../../ui/widgets
  ui_tokens:
    path: ../../ui/tokens

dev_dependencies:
  bge_test_support:
    path: ../../testing/support
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  l10n_test_support:
    path: ../../testing/l10n

flutter:
  generate: true
  uses-material-design: true

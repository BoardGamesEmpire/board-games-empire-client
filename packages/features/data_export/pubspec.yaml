name: data_export
description: "Export your data: save a copy of your data on a server as a JSON file (#93)"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  # The export spine (#48): the bundle, the save sink and the exporters, as
  # abstractions; the bundler's `assemble` comes in as a function. Nothing
  # under `lib/` names `di`.
  interfaces:
    path: ../../core/interfaces
  intl: ^0.20.2
  observability:
    path: ../../core/observability
  ui:
    path: ../../ui/widgets
  ui_tokens:
    path: ../../ui/tokens

dev_dependencies:
  bge_test_support:
    path: ../../testing/support
  # The answer's dwell, timed without waiting it out.
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  l10n_test_support:
    path: ../../testing/l10n
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

# Static analysis configuration for `package:observability`.
#
# Mirrors the sibling core packages (`models`, `interfaces`): the
# 'recommended' lint set from `package:lints`.

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:lints/recommended.yaml

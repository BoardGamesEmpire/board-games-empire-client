name: app_shell
description: "Shared application shell: bootstrap sequencing, routing, and shell screens"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  auth:
    path: ../features/auth
  data_gateway:
    path: ../features/data_gateway
  di:
    path: ../core/di
  events:
    path: ../features/events
  feedback:
    path: ../features/feedback
  flutter:
    sdk: flutter
  # State management
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  game_catalog:
    path: ../features/catalog
  game_collection:
    path: ../features/collection
  game_filters:
    path: ../features/game_filters
  # Navigation
  go_router: ^18.0.0
  household:
    path: ../features/household
  # State management
  hydrated_bloc: ^11.0.0
  interfaces:
    path: ../core/interfaces
  intl: ^0.20.2
  logging: ^1.3.0
  models:
    path: ../core/models
  network_interface:
    path: ../network/network_interface
  observability:
    path: ../core/observability
  server_onboarding:
    path: ../features/server_onboarding
  server_settings:
    path: ../features/server_settings
  sync_queue:
    path: ../features/sync
  ui:
    path: ../ui/widgets
  ui_tokens:
    path: ../ui/tokens
  user_search:
    path: ../features/user_search

dev_dependencies:
  # Shared test helpers (#354, #213, #257, #409): canned Dio transports and/or
  # widget-test viewport, semantics and scroll-geometry helpers, and the
  # `domain.dart` model builders.
  bge_test_support:
    path: ../testing/support
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  l10n_test_support:
    path: ../testing/l10n
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true

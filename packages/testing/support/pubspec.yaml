name: bge_test_support
description: "Shared test helpers that cannot live in any one package's test/ tree (issues #354, #213, #257)"
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

# Separate entry points, one package (#354 D1). `network.dart` needs only
# `dio`; `widgets.dart` needs `flutter_test` and the theme; `images.dart` (#42)
# needs `flutter_test` and `dart:io`. They are separate LIBRARIES
# rather than separate PACKAGES because pub resolves dependencies per package,
# not per library — a second package would not have isolated anything, since
# both `dio_network` and `web_network` already declare `flutter` as a regular
# dependency and `flutter_test` as a dev one.
#
# The export split still earns its place: it keeps the import surface honest and
# makes a future split mechanical if a genuinely pure-Dart consumer ever appears
# (`network_interface` is the only candidate in the tree). Move `network.dart`
# plus its `src/`, and consumers change one import line.
dependencies:
  # `CannedAdapter` and `ScriptedServer` implement dio's `HttpClientAdapter`.
  dio: ^5.11.0

  flutter:
    sdk: flutter

  # A REAL dependency, not a dev one: the public API of `widgets.dart` exposes
  # `WidgetTester`, so consumers cannot resolve this package without it.
  # Verified to resolve cleanly and draw no very_good_analysis complaint before
  # the package was created.
  flutter_test:
    sdk: flutter

  # `FakeCallerAccessRepository` (#456) implements `interfaces`'
  # `CallerAccessRepository` and answers in `models`' `CallerAccess`. Both are
  # pure Dart and depend on nothing here, so neither can cycle back.
  interfaces:
    path: ../../core/interfaces

  # `auditScreen` carries `@isTestGroup` so the IDE and analyzer treat its
  # call sites as group declarations (#50). Already resolved transitively
  # through `flutter_test`, so the lockfile does not move.
  meta: ^1.19.0

  models:
    path: ../../core/models

  # `BgeTheme`, installed by the viewport helper so a measure assertion against
  # BgeTokens cannot silently fall back to `BgeTokens.standard` (#213).
  # `ui_tokens` depends only on `flutter`, so this cannot cycle back through
  # `ui`, which dev-depends on this package.
  ui_tokens:
    path: ../../ui/tokens

dev_dependencies:
  # `TestHandle.current.name` (its public `hooks.dart`) reads the running
  # test's full name, to pin what `auditScreen` declares (#50). flutter_test
  # pins an exact version; this range only has to admit it.
  test_api: ^0.7.12

  # very_good_analysis per CONTRIBUTING.md, not the flutter_lints that
  # `packages/testing/l10n` carries — see #354 D5 and #194.
  very_good_analysis: ^10.2.0

# `ui_tokens` declares `uses-material-design: true`; without the same flag here
# `flutter test` warns on every run of a consumer suite.
flutter:
  uses-material-design: true

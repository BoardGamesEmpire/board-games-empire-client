name: drift_storage
description: "Drift databases and repositories: a platform-neutral half (drift_storage.dart) plus the native SQLCipher executor (drift_storage_native.dart)"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  cuid2: ^4.1.0
  di:
    path: ../../core/di
  drift: ^2.34.3
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  injectable: ^3.0.0
  interfaces:
    path: ../../core/interfaces
  models:
    path: ../../core/models
  path: ^1.9.0
  path_provider: ^2.1.3
  sqlite3: ^3.5.2
  storage_interface:
    path: ../storage_interface

dev_dependencies:
  # Shared ServerIdentity and AuthResponse test builders (#409).
  bge_test_support:
    path: ../../testing/support
  build_runner: ^2.16.0
  drift_dev: 2.34.5
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5
  observability:
    path: ../../core/observability

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# `bge_test_support` and its `ui_tokens` declare `uses-material-design: true`;
# without the same flag here `flutter test` warns on every run.
flutter:
  uses-material-design: true

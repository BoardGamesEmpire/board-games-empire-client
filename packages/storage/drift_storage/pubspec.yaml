name: drift_storage
description: "Drift databases and repositories: a platform-neutral half (drift_storage.dart) plus the native SQLCipher executor (drift_storage_native.dart)"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  storage_interface:
    path: ../storage_interface
  models:
    path: ../../core/models
  di:
    path: ../../core/di
  interfaces:
    path: ../../core/interfaces

  drift: ^2.34.3
  sqlite3: ^3.5.2
  path_provider: ^2.1.3
  path: ^1.9.0

  cuid2: ^4.1.0

  get_it: ^9.2.1
  injectable: ^3.0.0

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: 2.34.5
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

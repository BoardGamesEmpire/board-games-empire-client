name: web_storage
description: "IndexedDB storage for web"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  storage_interface:
    path: ../storage_interface
  models:
    path: ../../core/models
  di:
    path: ../../core/di

  # Web storage
  drift: ^2.34.3
  idb_shim: ^2.9.8

  # DI
  get_it: ^9.2.1
  injectable: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  drift_dev: 2.34.5
  injectable_generator: ^3.1.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0


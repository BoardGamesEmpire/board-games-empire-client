name: web_storage
description: "Drift/wasm query executor and web install path for the shared repositories (#288, #63)"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  # Bumped with the workspace to the analyzer-13 tier: 2.34.2 is the first
  # release whose assets include sqlite3.wasm, which is what lets
  # `tool/fetch_web_assets.dart` derive the release from the resolved
  # version instead of pinning one.
  drift: ^2.34.3
  # The platform-neutral half of the drift layer (#287): the databases as
  # executor-agnostic classes plus every repository. This package supplies
  # the executor those take, and nothing else — deliberately NOT
  # `drift_storage_native.dart`, which carries the dart:io surface.
  drift_storage:
    path: ../drift_storage
  flutter:
    sdk: flutter
  interfaces:
    path: ../../core/interfaces
  models:
    path: ../../core/models

dev_dependencies:
  # Shared ServerIdentity and AuthResponse test builders (#409).
  bge_test_support:
    path: ../../testing/support

  # Browser suites install into a real container, the same implementation the
  # web bootstrap uses.
  di:
    path: ../../core/di

  flutter_test:
    sdk: flutter

# `bge_test_support` and its `ui_tokens` declare `uses-material-design: true`;
# without the same flag here `flutter test` warns on every run.
flutter:
  uses-material-design: true

name: dio_network
description: "Universal HTTP implementation with Dio"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  http_status: ^3.3.3
  interfaces:
    path: ../../core/interfaces
  models:
    path: ../../core/models
  network_interface:
    path: ../network_interface
  observability:
    path: ../../core/observability

dev_dependencies:
  # Shared test helpers (#354, #213, #257, #409): canned Dio transports and/or
  # widget-test viewport, semantics and scroll-geometry helpers, and the
  # `domain.dart` model builders.
  bge_test_support:
    path: ../../testing/support
  flutter_test:
    sdk: flutter
  logging: ^1.3.0
  mocktail: ^1.0.5

flutter:

name: dio_network
description: "Universal HTTP implementation with Dio"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  network_interface:
    path: ../network_interface
  models:
    path: ../../core/models
  di:
    path: ../../core/di
  interfaces:
    path: ../../core/interfaces
  observability:
    path: ../../core/observability

  dio: ^5.11.0
  web_socket_channel: ^3.0.3
  oauth2: ^2.0.2
  flutter_secure_storage: ^11.0.0
  retry: ^3.1.2

  get_it: ^9.2.1
  injectable: ^3.0.0

  http_status: ^3.3.3

dev_dependencies:
  build_runner: ^2.16.0
  injectable_generator: ^3.1.3
  flutter_test:
    sdk: flutter
  logging: ^1.3.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0
  flutter_lints: ^6.0.0

flutter:

name: web_network
description: "Web-specific network implementations and overrides"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  di:
    path: ../../core/di
  # Base networking (inherits from dio_network)
  dio: ^5.11.0
  dio_network:
    path: ../dio_network
  flutter:
    sdk: flutter
  # DI
  get_it: ^9.2.1
  http_status: ^3.3.3
  injectable: ^3.0.0
  interfaces:
    path: ../../core/interfaces
  models:
    path: ../../core/models
  network_interface:
    path: ../network_interface
  observability:
    path: ../../core/observability
  web_socket_channel: ^3.0.3
  # Web-specific networking
  # dart:html is automatically available on web

dev_dependencies:
  # Shared test helpers (#354, #213, #257, #409): canned Dio transports and/or
  # widget-test viewport, semantics and scroll-geometry helpers, and the
  # `domain.dart` model builders.
  bge_test_support:
    path: ../../testing/support
  build_runner: ^2.16.0
  # Test-only: elapsing the provider sign-in's page-leave grace (#583).
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  # Test-only: asserting log records emitted through BgeLogger, matching
  # dio_network's dev-dependency on it for the same reason.
  logging: ^1.3.0
  mocktail: ^1.0.5

name: native_platform
description: "Shared native (mobile + desktop) composition root: MetaDB, orchestrator, installers"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

dependencies:
  access:
    path: ../../core/access
  app_links: ^7.2.1
  app_shell:
    path: ../../app_shell
  connectivity_platform:
    path: ../connectivity_platform
  data_gateway:
    path: ../../features/data_gateway
  di:
    path: ../../core/di
  dio_network:
    path: ../../network/dio_network
  drift: ^2.34.3
  drift_storage:
    path: ../../storage/drift_storage
  events:
    path: ../../features/events
  flutter:
    sdk: flutter
  flutter_web_auth_2: ^5.1.0
  game_collection:
    path: ../../features/collection
  household:
    path: ../../features/household
  hydrated_bloc: ^11.0.0
  interfaces:
    path: ../../core/interfaces
  key_storage:
    path: ../../storage/key_storage
  logging: ^1.3.0
  models:
    path: ../../core/models
  network_interface:
    path: ../../network/network_interface
  observability:
    path: ../../core/observability
  package_info_plus: ^10.2.1
  path_provider: ^2.1.3
  storage_interface:
    path: ../../storage/storage_interface
  # The sync queue's sender and drain (#121). Both platforms compose both;
  # web runs each drain pass under a Web Lock (#447), native under none.
  sync_queue:
    path: ../../features/sync

dev_dependencies:
  # `ScriptedServer`, the transport the root harness answers through (#435),
  # and the `domain.dart` model builders (#409).
  bge_test_support:
    path: ../../testing/support
  # Swaps the adapter under each server scope's real Dio (#435).
  dio: ^5.11.0
  # Fakes the keychain the real token storage reads (#435).
  flutter_secure_storage: ^11.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

name: ui
description: "Reusable UI components (widget layer; tokens live in ui_tokens)"
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.4"
resolution: workspace

# Dependencies are added WHEN A WIDGET HERE IMPORTS THEM, never in advance.
#
# This list previously carried ~30 packages — rive, lottie, fl_chart,
# photo_view, image_picker, awesome_dialog and the rest — speculatively
# provisioned for widgets that were never built. Every feature package depends
# on `ui`, so each of those rode into all three app binaries: build weight and
# supply-chain surface, on a privacy-first self-hosted client, in exchange for
# nothing. A repo-wide grep found zero imports of any of them.
#
# Re-adding one is cheap and reversible. Carrying one that nothing imports is
# neither, because nobody can tell later whether it is load-bearing.
dependencies:
  flutter:
    sdk: flutter

  # Design tokens (#32) — the dependency-cheap leaf. Widgets consume the theme
  # through it, feature packages depend on `ui`, the shell depends only on
  # `ui_tokens`.
  ui_tokens:
    path: ../tokens

  # Forms. Used by BgeTextField, which wraps ReactiveTextField.
  reactive_forms: ^18.1.1

dev_dependencies:
  flutter_lints: ^6.0.0

  # Testing — alchemist replaces the discontinued golden_toolkit (#32).
  flutter_test:
    sdk: flutter
  alchemist: ^0.14.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

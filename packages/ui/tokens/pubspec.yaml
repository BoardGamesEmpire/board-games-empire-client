name: ui_tokens
description: "Design tokens: WCAG-verified color schemes (light/dark/high-contrast), typography scale, spacing/density tokens, and the theme-level accessibility baseline (#32)"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.4"
resolution: workspace

# Deliberately minimal: this package is the dependency-cheap token leaf that
# app_shell (and transitively every app) pulls in. Widget-level dependencies
# belong in `ui` (packages/ui/widgets), never here.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  alchemist: ^0.14.0
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  # The display typeface (#32). Bundled, never fetched — an app that reaches
  # out to a font CDN at startup leaks a request per user, which is exactly
  # what a self-hosted, privacy-first client must not do. Bundling costs
  # binary size (~360KB) and nothing else.
  #
  # Applies to the display/headline/title roles ONLY; body and label stay on
  # the platform typeface. See `BgeTypography` for why that split exists.
  #
  # ONE variable font covers every weight the app uses. Static instances would
  # mean a separate ~120KB file per weight, so the variable file is smaller in
  # aggregate as soon as more than three weights are in play — and it unlocks
  # the `opsz` axis, which `BgeTypography.opticalSizeFor` uses to give large
  # display text genuinely different letterforms from small titles.
  #
  # Every axis must be set explicitly. Fraunces' own `fvar` defaults are
  # opsz=9, wght=900, WONK=1 — small-text letterforms, black weight, wonky
  # alternates on — so an unspecified axis is not "neutral", it is a choice,
  # and rarely the one you want. See `BgeTypography`.
  #
  # Not subsetted, deliberately: this build maps 624 codepoints and contains
  # no Cyrillic or Greek to strip, so the usual subsetting win is not there.
  # Dropping axes would save more, but `opsz` is load-bearing and the rest is
  # small — not worth a fonttools step in the toolchain for it.
  #
  # Licensed SIL OFL 1.1, which requires the notice to be DISTRIBUTED with the
  # font — not merely present in the repo. Flutter's license collector only
  # reads a `LICENSE` file at each package root, and asset declarations do not
  # feed it, so `fonts/OFL.txt` alone would never have reached a release build:
  # the notice lives in `packages/ui/tokens/LICENSE`, which the tool folds into
  # the app's aggregated licenses (and `showLicensePage`). `fonts/OFL.txt` is
  # kept as the upstream artifact. `font_license_test.dart` fails if either
  # goes missing.
  #
  # That LICENSE holds TWO entries — Apache-2.0 for this package's Dart source,
  # then the font's OFL — separated by a line of eighty hyphens, which is the
  # delimiter Flutter's collector splits on. Each entry is introduced by the
  # name it applies to followed by a blank line. The lone `ui_tokens` on line 1
  # reads like a stray word and is not: drop it and the Apache text's own first
  # three lines become the "package names" on the app's license page.
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces-Variable.ttf

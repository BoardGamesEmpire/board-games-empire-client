name: browser
description: "Board Games Empire web frontend"
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"
resolution: workspace

# Apps are thin wrappers: all composition lives in the platform package
# (which owns the concrete network dependencies) and the shared shell.
# That includes the web data layer — drift/wasm via web_storage (#63 D1,
# #288) — which arrives through web_platform's browser-only entry point,
# `web_storage_composition.dart`. Hence still no storage dependency here.
dependencies:
  flutter:
    sdk: flutter

  app_shell:
    path: ../../packages/app_shell
  web_platform:
    path: ../../packages/platform/web

  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

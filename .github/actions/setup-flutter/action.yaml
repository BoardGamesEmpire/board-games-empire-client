name: Set up Flutter
description: >-
  Installs the Flutter release that tool/flutter_sdk.sha256 names, checked
  against that committed digest, with the SDK and the pub cache cached.
  Replaces subosito's Flutter setup action, whose nested actions/cache@v5
  can't be pinned to a commit SHA (#426). With `save-caches: 'false'` it
  restores both caches but never saves them. Run it after actions/checkout;
  afterwards `flutter` and `dart` are on PATH and PUB_CACHE is set.

# Linux x64 runners only, like the archive the digest names.
# tool/install_flutter.sh does the download and the check, and
# tool/goldens/Dockerfile calls the same script, so CI and the golden
# container install Flutter one way (#159).
#
# The SDK cache key hashes the digest file, so a cache saved for another
# release can't be restored; on a hit the install script doesn't run at
# all. On a miss the script installs into a directory the cache just
# failed to fill, and it refuses one that is already there.

inputs:
  save-caches:
    description: >-
      'true' restores the SDK and the pub cache and saves them, as CI
      does. 'false', or any other value, restores them without saving.
      An issue-triggered job saves into master's cache scope, which
      master's CI restores, and the bug agent's fix job runs code nobody
      reviewed (#849).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The cache keys are worked out once here, so the saving and the
    # restore-only steps below can't drift apart.
    - name: Read the pinned release
      id: pin
      shell: bash
      env:
        SDK_KEY: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool/flutter_sdk.sha256') }}
        PUB_KEY: flutter-pub-${{ runner.os }}-${{ hashFiles('tool/flutter_sdk.sha256', 'pubspec.lock') }}
        PUB_PREFIX: flutter-pub-${{ runner.os }}-
      # The install script is the one reader of the digest line, and it
      # refuses a malformed one.
      run: |
        version=$(tool/install_flutter.sh --print-version)
        {
          echo "version=$version"
          echo "dir=$RUNNER_TOOL_CACHE/flutter/$version"
          echo "sdk-key=$SDK_KEY"
          echo "pub-key=$PUB_KEY"
          echo "pub-prefix=$PUB_PREFIX"
        } >> "$GITHUB_OUTPUT"

    # Two steps, one of which runs: actions/cache saves at the end of the
    # job, actions/cache/restore never does. Both take the path and key
    # from the pin step, so a restore-only run hits the entry CI saved.
    - name: Restore the Flutter SDK
      id: sdk
      if: inputs.save-caches == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pin.outputs.dir }}
        key: ${{ steps.pin.outputs.sdk-key }}

    - name: Restore the Flutter SDK without saving it
      id: sdk-restore-only
      if: inputs.save-caches != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pin.outputs.dir }}
        key: ${{ steps.pin.outputs.sdk-key }}

    - name: Install Flutter ${{ steps.pin.outputs.version }}
      if: steps.sdk.outputs.cache-hit != 'true' && steps.sdk-restore-only.outputs.cache-hit != 'true'
      shell: bash
      env:
        FLUTTER_DIR: ${{ steps.pin.outputs.dir }}
      run: tool/install_flutter.sh "$FLUTTER_DIR"

    - name: Put Flutter on PATH
      shell: bash
      env:
        FLUTTER_DIR: ${{ steps.pin.outputs.dir }}
      run: |
        echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
        echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
        echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"

    - name: Restore the pub cache
      if: inputs.save-caches == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: ${{ steps.pin.outputs.pub-key }}
        restore-keys: ${{ steps.pin.outputs.pub-prefix }}

    - name: Restore the pub cache without saving it
      if: inputs.save-caches != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pub-cache
        key: ${{ steps.pin.outputs.pub-key }}
        restore-keys: ${{ steps.pin.outputs.pub-prefix }}

    - name: Show the toolchain
      shell: bash
      run: flutter --disable-analytics && flutter --version

name: CI

on:
  pull_request:
  push:
    # Throwaway probe for #326: this branch's own pushes run CI too.
    branches: [master, ci-probe/326-wrong-sha]

# A newer push to a pull request cancels the run it supersedes. On master,
# each commit gets a group of its own, so no master run cancels another
# (#418): a re-run joins its group again, and re-running an older master
# run would cancel the newest one, which then never publishes. Every
# master commit runs to the end. `publish-web` runs one at a time across
# them, and tags only master's tip.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise (#326). Nothing here writes to the
# repository: the jobs check, build and test, and hand files to each other
# as artifacts. A job that needs more declares it for itself, so a new job
# starts with a token that can only read.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with its release as a
# trailing comment (#326). Anyone with write access to an action's
# repository can move a tag to new code, and every workflow using the tag
# runs it with no change here. A SHA cannot move. Renovate
# (.github/renovate.json) moves the pins and their comments together.
#
# The Flutter pin lives in the ROOT pubspec's `environment.flutter`, not
# here (#153). Every job below installs it with `flutter-version-file`,
# which reads that field literally — so a workflow can no longer disagree
# with the pubspecs about which toolchain this repo builds on. Pinning
# (rather than tracking `stable`) keeps codegen, analysis, and tests
# deterministic across runs.
#
# To bump: edit `environment:` in the root pubspec.yaml, run
# `dart run tool/check_sdk_constraints.dart --fix` to propagate the floor
# to all 28 workspace packages, and — because goldens (#32) run
# local-only, see the `test` job — regenerate them
# (`melos run goldens:update`) and commit the refreshed `goldens/ci/`
# PNGs in the same PR.

jobs:
  # ── Toolchain constraint consistency (#153) ──────────────────────
  # Fast, dependency-free gate: every package's sdk/flutter constraints
  # must agree with the root pin. Catches what pub cannot — a floor like
  # the old `flutter: ">=3.0.0"` never fails a resolve, because the Dart
  # floor already excludes every Flutter that low, so it drifts in
  # silence. Runs in parallel with everything else; needs no codegen.
  constraints:
    name: SDK constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      # The rewriter's failure mode is a silent no-op, which the workspace
      # check below cannot see (it only ever reads correct pubspecs), so
      # the drift shapes it must survive are pinned as fixtures.
      - name: Constraint tooling self-test
        run: dart run tool/check_sdk_constraints.dart --self-test
      - name: Constraints must match the root pin
        run: dart run tool/check_sdk_constraints.dart

  # ── Palette verification (#192) ──────────────────────────────────
  # `bge_color_schemes.dart` is generated, and the token tests assert the
  # generated VALUES. Nothing asserted the generator: it could lose its
  # verify mode and stay green until the next person regenerated the
  # palette by hand. Codegen-free like the two jobs around it — the
  # script is plain Dart and only needs the workspace resolved, since it
  # shares the hue math and the separation floor with `Oklch` (#172).
  palette:
    name: Palette
    runs-on: ubuntu-latest
    steps:
      # Throwaway probe for #326: the real v4.4.0 SHA ends in ...677262.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677263 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Palette must satisfy its own contrast and hue targets
        run: dart run tool/derive_palette.dart

  # ── Formatting (#173) ────────────────────────────────────────────
  # Standalone and codegen-free, like `constraints`: formatting parses,
  # it does not resolve types, so no generated sources are needed. They
  # are gitignored and `git ls-files` therefore never offers them —
  # which is also what keeps this job checking the same file set a
  # developer checks locally, where those files are present on disk.
  #
  # `flutter pub get` IS required, and not for package resolution as
  # such: very_good_analysis sets `formatter: trailing_commas: preserve`
  # and reaches the formatter via an `include:` on a package: URI. With
  # no package_config that include silently falls back to `automate`,
  # the formatter joins calls a trailing comma should have pinned open,
  # and this job would fail commits every developer sees as clean.
  # --language-version does not substitute for it.
  #
  # Runs the same script the `format:check` melos script runs, so the
  # file-set rules have one definition — the `check_sdk_constraints`
  # arrangement, and the reason this job does not simply call melos.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Dart source must be formatted
        run: dart run tool/format_workspace.dart --check

  # ── Test file names (#197) ───────────────────────────────────────
  # `flutter test` runs only files named `*_test.dart`. A suite under
  # `test/` with any other name is skipped without a word: its tests
  # exist, read as coverage, and never run. That is how models'
  # achievement tests went unrun until #197. Codegen-free like the jobs
  # above, and the same shared-script arrangement: `check:test-files`
  # runs the identical command. The self-test comes first because this
  # gate's failure mode is a silent pass, which the check itself cannot
  # see on a tree that holds nothing for it to catch.
  test-files:
    name: Test file names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Test-file check self-test
        run: dart run tool/check_test_files.dart --self-test
      - name: Every suite under test/ must be named to run
        run: dart run tool/check_test_files.dart

  # ── Codegen (fresh, once) + schema freshness ────────────────────
  # Generated code (.g.dart / .freezed.dart / .config.dart, and the
  # gen-l10n localizations per #33) is gitignored, so every job that
  # compiles or analyses Dart needs it produced first. Rather than
  # regenerate in each job, this single job generates once, verifies it,
  # and publishes the output as an artifact that `analyze` and `test`
  # restore. That keeps generation fresh on every run with no
  # committed/stale artifacts.
  #
  # Staging (#33): gen-l10n runs FIRST — the generated localizations must
  # exist before the build_runner pass, mirroring the local
  # `melos run generate` pipeline (generate:i18n → generate:build). Each
  # package that owns an l10n.yaml gets its own `flutter gen-l10n` run
  # (the synthetic package is gone; output is real source per package).
  #
  # Codegen then runs as a single workspace-wide build_runner pass at the
  # repo root (--workspace): the builder is AOT-compiled once instead
  # of once per package, packages build in parallel internally, and the
  # build cache lands in a single root .dart_tool/build. No melos here.
  #
  # Two gates:
  #   1. Codegen must complete with no errors.
  #   2. A fresh `schema dump` must byte-match the committed snapshots.
  generate:
    name: Codegen + schema freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      # Restore build_runner's incremental state (asset graph + cached
      # outputs) so unchanged sources skip regeneration. The lockfile
      # hash scopes the cache to a dependency set; the SHA suffix makes
      # each run save a fresh entry, and restore-keys prefix-match the
      # most recent prior cache. A dep change (new lockfile) misses and
      # forces a correct full rebuild.
      - name: Restore build_runner cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # --workspace writes a single build cache at the repo root.
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-
            build-runner-${{ runner.os }}-
      - name: Resolve workspace
        run: flutter pub get
      - name: Generate localizations (gen-l10n stage, before build_runner)
        run: |
          set -euo pipefail
          # Null-delimited so paths with spaces are safe, and the find
          # runs OUTSIDE the loop's command substitution so a failure
          # (e.g. a missing dir) actually aborts the step instead of
          # silently yielding an empty list.
          while IFS= read -r -d '' f; do
            pkg=$(dirname "$f")
            echo "gen-l10n: $pkg"
            (cd "$pkg" && flutter gen-l10n)
          done < <(find packages apps -name l10n.yaml -not -path '*/.dart_tool/*' -print0)
      - name: Codegen must succeed (single workspace pass)
        run: flutter pub run build_runner build --workspace
      - name: Schema snapshots must be fresh
        working-directory: packages/storage/drift_storage
        run: |
          set -uo pipefail
          tmp=$(mktemp -d)
          flutter pub run drift_dev schema dump lib/src/databases/server_database.dart "$tmp/server/"
          flutter pub run drift_dev schema dump lib/src/databases/meta_database.dart   "$tmp/meta/"
          fail=0
          for db in server meta; do
            for fresh in "$tmp/$db"/drift_schema_v*.json; do
              name=$(basename "$fresh")
              committed="drift_schemas/$db/$name"
              if [ ! -f "$committed" ]; then
                echo "::error::Missing committed snapshot: $committed"
                fail=1
                continue
              fi
              if ! diff -q "$committed" "$fresh" >/dev/null; then
                echo "::error::Stale snapshot: $committed differs from a fresh dump. Run 'melos run schema:dump' and commit the result."
                diff "$committed" "$fresh" || true
                fail=1
              fi
            done
          done
          exit "$fail"
      - name: Bundle generated sources
        run: |
          find . \( -name '*.g.dart' -o -name '*.freezed.dart' \
                    -o -name '*.config.dart' -o -name '*.mocks.dart' \
                    -o -name '*_localizations*.dart' \) \
            -not -path '*/.dart_tool/*' -print0 \
            | tar --null -czf "$RUNNER_TEMP/generated.tar.gz" -T -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}/generated.tar.gz
          retention-days: 1

  # ── Static analysis ─────────────────────────────────────────────
  # One root `dart analyze .` walks every workspace member and honours
  # each package's own analysis_options.yaml. Needs generated code, so
  # it restores the artifact from `generate` first.
  #
  # --fatal-infos because infos were invisible to every gate before
  # #158: `dart analyze` exits 0 on them, so three
  # unintended_html_in_doc_comment infos sat in core/observability
  # unnoticed and had to be re-triaged as "known" each time anyone
  # looked. The workspace is clean at this level, so keep it that way —
  # if a new info is genuinely acceptable, silence it at the source with
  # an `// ignore:` and a reason rather than reopening the gate.
  analyze:
    name: Analyze
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze whole workspace
        run: dart analyze --fatal-infos .

  # ── Discover packages that have tests ───────────────────────────
  # Builds the test matrix dynamically so new packages are picked up
  # automatically — nothing to keep in sync by hand.
  discover-tests:
    name: Discover test packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: find
        run: |
          pkgs=$(find packages apps -type d -name test -not -path '*/.*/*' \
            | sed 's:/test$::' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Discovered test packages: $pkgs"

  # ── Tests (one job per package, in parallel) ────────────────────
  # `flutter test` for every package — drift_storage's suites import
  # flutter_test, so `dart test` can't run them, and `flutter test`
  # runs pure-Dart suites cleanly too. Restores generated code first.
  # fail-fast off so one red package doesn't cancel the rest.
  #
  # Goldens (#32) are EXCLUDED here (`--exclude-tags golden`) and run
  # local-only. Alchemist's CI goldens obscure text but still rasterize
  # shapes/anti-aliasing per-platform, so a macOS-generated baseline
  # won't match a Linux runner — the version pin removes engine skew but
  # not OS skew. Restoring CI coverage means generating the committed
  # `goldens/ci/` baselines on Linux (e.g. a Docker/CI --update-goldens
  # job) and disabling the CI-golden variant locally; deferred for now.
  test:
    name: Test ${{ matrix.package }}
    needs: [generate, discover-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-tests.outputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: flutter test
        working-directory: ${{ matrix.package }}
        run: flutter test --coverage --exclude-tags golden --test-randomize-ordering-seed random
      # ── Coverage → Codecov ──────────────────────────────────────────
      # `flutter test` writes lcov paths relative to the PACKAGE
      # (`SF:lib/src/...`), and nearly every package has a `lib/src/`, so
      # uploaded as-is they collide and Codecov cannot place them. The
      # package dir is prefixed here, per report — codecov.yml `fixes:`
      # rewrite repo-wide and cannot tell one package's upload from
      # another's.
      #
      # The flag is the package path minus `packages/`, slashes → dashes
      # (Codecov flags allow only [\w.-], max 45). The path rather than
      # the dir name keeps flags unique as packages are added, and
      # `platform-web` says more than `web`. That holds only while no dir
      # name has a dash of its own (`a-b/c` and `a/b-c` would share a
      # flag), so the step below enforces it and the length, failing
      # loudly rather than letting Codecov reject or merge an upload
      # behind the non-fatal step. Flag config and ignores live in
      # codecov.yml.
      #
      # Two blind spots, both of which read as HIGHER coverage, not lower:
      #   - A file no test imports is absent from lcov entirely, so it
      #     does not count against the package.
      #   - Code only the browser suites reach (`test-web`) is absent too:
      #     `flutter test --platform chrome --coverage` writes an empty
      #     report on the pinned Flutter, so that job does not upload.
      # Goldens are excluded above, so golden-only widget code reads low.
      - name: Prefix coverage paths with the package dir
        id: coverage
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          rel="${PACKAGE#packages/}"
          if [[ ! "$rel" =~ ^[A-Za-z0-9_/]+$ ]]; then
            echo "::error::$PACKAGE: use only [A-Za-z0-9_] in dir names; its Codecov flag could collide with another package's."
            exit 1
          fi
          flag="${rel//\//-}"
          if (( ${#flag} > 45 )); then
            echo "::error::$PACKAGE: Codecov flag '$flag' is ${#flag} chars; the limit is 45."
            exit 1
          fi
          report="$PACKAGE/coverage/lcov.info"
          # A package whose every test is excluded here (golden-only, or
          # browser-only) has no report. Not an error — just nothing to send.
          if [ ! -s "$report" ]; then
            echo "::notice::No coverage report for $PACKAGE; skipping upload."
            echo "report=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|^SF:|SF:$PACKAGE/|" "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
      # Not fatal: a Codecov outage should not turn a green test run red.
      # Fork PRs have no access to the token and upload tokenless, which
      # Codecov accepts for public repos.
      - name: Upload coverage
        if: steps.coverage.outputs.report != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ${{ steps.coverage.outputs.report }}
          disable_search: true
          flags: ${{ steps.coverage.outputs.flag }}
          name: ${{ steps.coverage.outputs.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Browser tests (#288) ─────────────────────────────────────
  # Some suites cannot run on the VM at all: `package:drift/wasm.dart`
  # reaches `dart:js_interop`, so `web_storage`'s entire lib — and
  # `web_platform`'s storage composition — is uncompilable there. Those
  # files carry `@TestOn('browser')`, which means the `test` job above
  # SKIPS them (a platform-mismatched file is excluded before compile);
  # this job is where they actually run.
  #
  # Note the packages are listed rather than discovered. `discover-tests`
  # finds test *directories*, and every package here also has VM suites in
  # the same directory — so this is not "the packages the other job
  # can't do", it is "the packages that additionally need a browser".
  # Add one when it grows its first browser suite.
  #
  # Mirrors `melos run test:web`. Kept as its own job (not a matrix
  # dimension of `test`) because it needs Chrome and the fetched wasm
  # assets, and neither belongs in the 28-package matrix.
  test-web:
    name: Browser test ${{ matrix.package }}
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/storage/web_storage
          - packages/platform/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      # The wasm binaries are versioned artifacts of the drift release and
      # are gitignored (#288), so CI fetches them like a developer does.
      # Runs before the test, and fails the job if the pinned release no
      # longer matches the resolved `drift` version.
      - name: Fetch drift/wasm assets
        run: dart run tool/fetch_web_assets.dart
      # `flutter test --platform chrome` needs a browser and does not
      # install one. GitHub's ubuntu image ships Chrome, but naming a path
      # blindly turns a missing browser into a confusing driver error, so
      # resolve it here and fail with a sentence instead.
      - name: Locate Chrome
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROME_EXECUTABLE=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No Chrome/Chromium on this runner. The browser suites (#288) need one; install it in this job or pin a runner image that ships it."
          exit 1
      - name: flutter test --platform chrome
        working-directory: ${{ matrix.package }}
        run: flutter test --platform chrome --test-randomize-ordering-seed random

  # ── Web build (#418) ─────────────────────────────────────────────
  # Builds the web app the way #418 publishes it, on every PR. No other job
  # builds an app (#51), so before this one a change could break the
  # release build and every check would stay green.
  #
  # The fetch, then tool/build_web.dart, the same two steps
  # `melos run build-web` runs: the `format_workspace.dart` arrangement, so
  # the build has one definition. The script empties the output, builds
  # with the published flags, removes the tooling dotfiles, fails on any
  # other dotfile, and requires the files the app boots from. `publish-web`
  # builds its image from this job's artifact, so the files checked here
  # are the files that ship.
  build-web:
    name: Web build
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      # Each file is checked against its committed SHA-256 before it is
      # placed, and a mismatch fails the step.
      - name: Fetch drift/wasm assets
        run: dart run tool/fetch_web_assets.dart
      - name: Build the web app as it ships
        run: dart run tool/build_web.dart
      # Only `publish-web` reads this, so only a run that publishes uploads
      # it: the same condition as that job's `if:`. It is kept a week, so
      # "Re-run failed jobs" can still retry a failed publish after a
      # weekend. After that, "Re-run all jobs" builds it again.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: web-build
          path: apps/browser/build/web
          retention-days: 7
          if-no-files-found: error

  # ── Publish the web image (#418) ─────────────────────────────────
  # Pushes `build-web`'s files as ghcr.io/boardgamesempire/bge-client-web,
  # the image the backend copies its bundled client from. Only a push to
  # master publishes, after every gate above has passed, so a published
  # commit is a tested one. `needs:` lists the gates by hand: a new gate
  # job has to be added there, or it will not hold publishing back.
  #
  # `sha-<short>` names one commit and never moves. `edge` is master's
  # newest published commit. There are no version tags yet (#419). Three
  # rules keep the tags honest:
  #   - The image is pushed by digest and checked before either tag points
  #     at it, so a failed check leaves both tags where they were.
  #   - Only master's tip is tagged. Master runs do not cancel each other
  #     (top of this file), so an older commit's run can get here after a
  #     newer push, and a re-run can get here at any time. The job runs one
  #     at a time across all of them, and its last step checks the tip just
  #     before it writes, leaving the image untagged if master has moved on.
  #     Every step before that is safe to repeat: nothing a tag points at
  #     changes until then.
  #   - A `sha-<short>` never moves. If one already names this commit, an
  #     earlier attempt pushed and checked it, and this one checks and tags
  #     that image instead of pushing another. If it names any other
  #     commit, the job stops.
  #
  # The image is one bare manifest: no index, provenance or SBOM. A default
  # push from a public repository attaches provenance, which wraps even a
  # single-platform image in an index, and an arm64 consumer of an
  # amd64-only index fails with "no match for platform in manifest". A bare
  # manifest copies on any platform. The check proves it on the two the
  # backend builds.
  #
  # The package is created on the first push. GitHub's docs disagree on
  # whether a workflow's new package starts public, inheriting this public
  # repository's visibility, or private. If it is private, an org owner
  # makes it public, which cannot be undone.
  publish-web:
    name: Publish web image
    needs: [constraints, palette, format, test-files, generate, analyze, test, test-web, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # One publish at a time, across every master run. The tip check holds
    # only if no other run can write the tags between it and this run's
    # write: otherwise a run that stalled there could land after a newer
    # commit's publish and move `edge` back to the older image.
    # `queue: max` keeps every waiting job. By default a group holds one
    # pending job and cancels it when the next arrives, so re-running an
    # older commit's publish would cancel the tip's.
    concurrency:
      group: bge-client-web
      queue: max
    # A stuck job holds the queue, for six hours by default.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/boardgamesempire/bge-client-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-build
          path: ${{ runner.temp }}/image/web
      # The version label carries what the app reports, and `created` the
      # commit's date rather than the build's (see the Dockerfile).
      - name: Read the labels and the short SHA
        id: meta
        run: |
          set -euo pipefail
          version=$(jq -er .version "$RUNNER_TEMP/image/web/version.json")
          created=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$GITHUB_SHA")
          {
            echo "short=${GITHUB_SHA::7}"
            echo "version=$version"
            echo "created=$created"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A sha tag is written only after its image passed the check, so one
      # that names this commit is an earlier attempt's image, and the steps
      # below check and tag it again rather than push another. One naming
      # any other commit, a short-SHA collision or a hand-pushed tag, stops
      # the job.
      #
      # "not found" is a missing tag. 403 and "denied" mean this token
      # cannot read the package, which before the first push is because it
      # does not exist; a token that cannot read it cannot push to it either,
      # so going on can never overwrite anything. Any other failure stops
      # the job rather than guess.
      - name: Look for this commit's image from an earlier attempt
        id: existing
        env:
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-$SHORT"
          if ! manifest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err"); then
            err=$(cat "$RUNNER_TEMP/inspect.err")
            case "$err" in
              *"not found"* | *"403 Forbidden"* | *denied*)
                echo "$ref is not published yet."
                exit 0 ;;
              *)
                echo "::error::Could not tell whether $ref exists: $err"
                exit 1 ;;
            esac
          fi
          digest=$(jq -er .digest <<<"$manifest")
          revision=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image.Config.Labels}}' \
            | jq -r '."org.opencontainers.image.revision" // empty')
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$ref names ${revision:-an image with no revision label}, not $GITHUB_SHA, and sha tags never move."
            exit 1
          fi
          echo "::notice::An earlier attempt pushed $ref as $digest. This one checks and tags that image."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Push the image by digest, untagged
        id: push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: apps/browser/Dockerfile
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            CREATED=${{ steps.meta.outputs.created }}
      - name: Check the digest from amd64 and arm64
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          type=$(docker buildx imagetools inspect --raw "$ref" | jq -r .mediaType)
          case "$type" in
            *image.manifest* | *distribution.manifest.v2*) ;;
            *)
              echo "::error::$ref is a $type, not a single image manifest."
              exit 1 ;;
          esac
          # The backend's own move: COPY --from by digest, once per platform
          # it builds. The copied files must be exactly what build-web checked.
          check=$(mktemp -d)
          mkdir "$check/context"
          printf 'FROM scratch\nCOPY --from=%s /web /web\n' "$ref" > "$check/context/Dockerfile"
          for platform in linux/amd64 linux/arm64; do
            out="$check/${platform//\//-}"
            docker buildx build --platform "$platform" --output "type=local,dest=$out" "$check/context"
            diff -r "$RUNNER_TEMP/image/web" "$out/web"
            echo "::group::$platform: COPY --from copied $(find "$out/web" -type f | wc -l) files to /web"
            (cd "$out/web" && find . -type f | sort)
            echo "::endgroup::"
          done
      # No step before this one changes anything a consumer can see, so the
      # tip check sits here, just before the write, and the job's
      # concurrency group keeps every other run's write out of the gap
      # between them. A step added after it runs for a commit it left
      # untagged, too. --prefer-index=false copies the manifest under the
      # new tags as it is. Left to default, a single source is wrapped in a
      # new index.
      - name: Tag the checked digest, if this commit is still master's tip
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
          SHORT: ${{ steps.meta.outputs.short }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::master has moved on to $tip, so $GITHUB_SHA is not tagged."
            echo "Not tagged: master has moved on to \`$tip\`. \`$DIGEST\` stays untagged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:sha-$SHORT" --tag "$IMAGE:edge" "$IMAGE@$DIGEST"
          for tag in "sha-$SHORT" edge; do
            got=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$tag points at $got, not $DIGEST."
              exit 1
            fi
          done
          echo "Published \`$IMAGE:edge\` and \`$IMAGE:sha-$SHORT\` as \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"

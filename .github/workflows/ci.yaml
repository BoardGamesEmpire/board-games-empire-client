name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to a pull request cancels the run it supersedes. On master,
# each commit gets a group of its own, so no master run cancels another
# (#418): a re-run joins its group again, and re-running an older master
# run would cancel the newest one, which then never publishes. Every
# master commit runs to the end. `publish-web` runs one at a time across
# them, and moves `edge` only forward along master (#424).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise (#326). Nothing here writes to the
# repository: the jobs check, build and test, and hand files to each other
# as artifacts. A job that needs more declares it for itself, so a new job
# starts with a token that can only read.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with its release as a
# trailing comment (#326). Anyone with write access to an action's
# repository can move a tag to new code, and every workflow using the tag
# runs it with no change here. A SHA cannot move. Renovate
# (.github/renovate.json) moves the pins and their comments together.
#
# The Flutter pin lives in the ROOT pubspec's `environment.flutter`, not
# here (#153). Every job below sets Flutter up with the local
# `.github/actions/setup-flutter`, which installs the release that
# `tool/flutter_sdk.sha256` names and refuses an archive that doesn't
# match its digest. `check_sdk_constraints` holds that file to the root
# pin, so a workflow can't disagree with the pubspecs about which
# toolchain this repo builds on. No third-party action sets Flutter up
# (#426): the one this replaced nested a cache action that couldn't be
# pinned to a SHA. Pinning (rather than tracking `stable`) keeps codegen,
# analysis, and tests deterministic across runs.
#
# To bump: edit `environment:` in the root pubspec.yaml, run
# `dart run tool/check_sdk_constraints.dart --fix` to propagate the floor
# to all 28 workspace packages, replace `tool/flutter_sdk.sha256` with the
# new archive name and sha256 from Flutter's releases_linux.json, and
# regenerate the goldens (`melos run goldens:update`, which renders them
# in the golden container) and commit the refreshed `goldens/ci/` PNGs in
# the same PR.

jobs:
  # ── Workspace invariants (#153, #156, #73, #51) ──────────────────
  # Fast, dependency-free gate: every package's sdk/flutter constraints
  # must agree with the root pin, every pubspec must declare
  # `publish_to: none`, every app must report the root `version:`, and no
  # native app may depend on a web implementation.
  # Catches what pub cannot — a floor like the old `flutter: ">=3.0.0"`
  # never fails a resolve, because the Dart floor already excludes every
  # Flutter that low, so it drifts in silence. Likewise a hand-set
  # version in an Android, iOS, macOS or Windows manifest: only Android
  # is built here (`build-android`), and a build takes any version.
  # And a desktop app compiling web code: no job builds desktop.
  # Runs in parallel with everything else; needs no codegen.
  constraints:
    name: Workspace invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      # A rewriter's failure mode is a silent no-op, which the workspace
      # check below cannot see (it only ever reads correct pubspecs), so
      # the drift shapes it must survive are pinned as fixtures. The
      # manifest checks only ever read correct manifests, so the
      # hand-set versions they must catch are pinned the same way. The
      # self-test pins the rewriters, and `tool/test` pins `main`'s exit
      # codes by running both modes over fixture workspaces (#201).
      - name: Invariant tooling self-test
        run: dart run tool/check_sdk_constraints.dart --self-test
      - name: Invariant tooling exit codes
        run: dart test tool/test
      - name: Invariants must hold against the root pubspec
        run: dart run tool/check_sdk_constraints.dart

  # ── Palette verification (#192) ──────────────────────────────────
  # `bge_color_schemes.dart` is generated, and the token tests assert the
  # generated VALUES. Nothing asserted the generator: it could lose its
  # verify mode and stay green until the next person regenerated the
  # palette by hand. Codegen-free like the two jobs around it — the
  # script is plain Dart and only needs the workspace resolved, since it
  # shares the hue math and the separation floor with `Oklch` (#172).
  palette:
    name: Palette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: Palette must satisfy its own contrast and hue targets
        run: dart run tool/derive_palette.dart

  # ── Golden baselines (#159) ──────────────────────────────────────
  # Compares every package's golden suites against the committed
  # `goldens/ci/` PNGs. They run in the golden container
  # (tool/goldens/Dockerfile), not on the runner, because that container
  # owns the baselines: even Ahem-rendered goldens anti-alias edges
  # differently from host to host, so only one renderer can agree with
  # them. This is the same command contributors run (`melos run
  # test:goldens`), so a local pass and a CI pass mean the same thing.
  # Codegen-free like `palette`: the golden suites import no generated
  # code.
  #
  # The runner sets Flutter up like every other job: the wrapper is a
  # Dart script, and it computes the image tag. The container doesn't
  # download the workspace again, because GOLDENS_PUB_CACHE hands it the
  # runner's pub cache, which the resolve here has already filled.
  #
  # The image is cached as a tarball under its tag, which hashes the
  # Dockerfile, the install script and the Flutter digest, so it is built
  # once per toolchain and loaded after that. It is saved whether or not
  # the goldens matched. The image is the same either way, and a PR whose
  # goldens fail would otherwise rebuild it on every push. On a failure
  # the diff images are uploaded as `golden-failures`.
  goldens:
    name: Goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: Name the golden image
        id: image
        run: echo "tag=$(dart run tool/goldens.dart --image-tag)" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps because the combined cache
      # action saves only after a green job.
      - name: Restore the golden image
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bge-goldens.tar
          key: goldens-image-${{ steps.image.outputs.tag }}
      - name: Load the golden image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/bge-goldens.tar"
      - name: Goldens must match the committed baselines
        run: GOLDENS_PUB_CACHE="$PUB_CACHE" dart run tool/goldens.dart
      # Exports nothing when the image was never built.
      - name: Export the golden image
        id: image-export
        if: ${{ !cancelled() && steps.image-cache.outputs.cache-hit != 'true' }}
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker save "$IMAGE" -o "$RUNNER_TEMP/bge-goldens.tar"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the golden image
        if: ${{ !cancelled() && steps.image-export.outputs.saved == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bge-goldens.tar
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: packages/**/test/goldens/failures/
          if-no-files-found: ignore

  # ── Formatting (#173) ────────────────────────────────────────────
  # Standalone and codegen-free, like `constraints`: formatting parses,
  # it does not resolve types, so no generated sources are needed. They
  # are gitignored and `git ls-files` therefore never offers them —
  # which is also what keeps this job checking the same file set a
  # developer checks locally, where those files are present on disk.
  #
  # `flutter pub get` IS required, and not for package resolution as
  # such: very_good_analysis sets `formatter: trailing_commas: preserve`
  # and reaches the formatter via an `include:` on a package: URI. With
  # no package_config that include silently falls back to `automate`,
  # the formatter joins calls a trailing comma should have pinned open,
  # and this job would fail commits every developer sees as clean.
  # --language-version does not substitute for it.
  #
  # Runs the same script the `format:check` melos script runs, so the
  # file-set rules have one definition — the `check_sdk_constraints`
  # arrangement, and the reason this job does not simply call melos.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: Dart source must be formatted
        run: dart run tool/format_workspace.dart --check

  # ── Test file names (#197) ───────────────────────────────────────
  # `flutter test` runs only files named `*_test.dart`. A suite under
  # `test/` with any other name is skipped without a word: its tests
  # exist, read as coverage, and never run. That is how models'
  # achievement tests went unrun until #197. Codegen-free like the jobs
  # above, and the same shared-script arrangement: `check:test-files`
  # runs the identical command. The self-test comes first because this
  # gate's failure mode is a silent pass, which the check itself cannot
  # see on a tree that holds nothing for it to catch. The same job also
  # runs `check:a11y-audit` (#50), which fails when a screen has no
  # accessibility-audit test group.
  test-files:
    name: Test file names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: Test-file check self-test
        run: dart run tool/check_test_files.dart --self-test
      - name: Every suite under test/ must be named to run
        run: dart run tool/check_test_files.dart
      - name: A11y audit check self-test
        run: dart run tool/check_a11y_audit.dart --self-test
      - name: Every screen has an accessibility audit
        run: dart run tool/check_a11y_audit.dart

  # ── Codegen (fresh, once) + schema freshness ────────────────────
  # Generated code (.g.dart / .freezed.dart / .config.dart, and the
  # gen-l10n localizations per #33) is gitignored, so every job that
  # compiles or analyses Dart needs it produced first. Rather than
  # regenerate in each job, this single job generates once, verifies it,
  # and publishes the output as an artifact that `analyze` and `test`
  # restore. That keeps generation fresh on every run with no
  # committed/stale artifacts.
  #
  # Staging (#33): gen-l10n runs FIRST — the generated localizations must
  # exist before the build_runner pass, mirroring the local
  # `melos run generate` pipeline (generate:i18n → generate:build). Each
  # package that owns an l10n.yaml gets its own `flutter gen-l10n` run
  # (the synthetic package is gone; output is real source per package).
  #
  # Codegen then runs as a single workspace-wide build_runner pass at the
  # repo root (--workspace): the builder is AOT-compiled once instead
  # of once per package, packages build in parallel internally, and the
  # build cache lands in a single root .dart_tool/build. No melos here.
  #
  # Two gates:
  #   1. Codegen must complete with no errors.
  #   2. A fresh `schema dump` must byte-match the committed snapshots.
  generate:
    name: Codegen + schema freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      # Restore build_runner's incremental state (asset graph + cached
      # outputs) so unchanged sources skip regeneration. The lockfile
      # hash scopes the cache to a dependency set; the SHA suffix makes
      # each run save a fresh entry, and restore-keys prefix-match the
      # most recent prior cache. A dep change (new lockfile) misses and
      # forces a correct full rebuild.
      - name: Restore build_runner cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # --workspace writes a single build cache at the repo root.
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}-
            build-runner-${{ runner.os }}-
      - name: Resolve workspace
        run: flutter pub get
      - name: Generate localizations (gen-l10n stage, before build_runner)
        run: |
          set -euo pipefail
          # Null-delimited so paths with spaces are safe, and the find
          # runs OUTSIDE the loop's command substitution so a failure
          # (e.g. a missing dir) actually aborts the step instead of
          # silently yielding an empty list.
          while IFS= read -r -d '' f; do
            pkg=$(dirname "$f")
            echo "gen-l10n: $pkg"
            (cd "$pkg" && flutter gen-l10n)
          done < <(find packages apps -name l10n.yaml -not -path '*/.dart_tool/*' -print0)
      - name: Codegen must succeed (single workspace pass)
        run: flutter pub run build_runner build --workspace
      - name: Schema snapshots must be fresh
        working-directory: packages/storage/drift_storage
        run: |
          set -uo pipefail
          tmp=$(mktemp -d)
          flutter pub run drift_dev schema dump lib/src/databases/server_database.dart "$tmp/server/"
          flutter pub run drift_dev schema dump lib/src/databases/meta_database.dart   "$tmp/meta/"
          fail=0
          for db in server meta; do
            for fresh in "$tmp/$db"/drift_schema_v*.json; do
              name=$(basename "$fresh")
              committed="drift_schemas/$db/$name"
              if [ ! -f "$committed" ]; then
                echo "::error::Missing committed snapshot: $committed"
                fail=1
                continue
              fi
              if ! diff -q "$committed" "$fresh" >/dev/null; then
                echo "::error::Stale snapshot: $committed differs from a fresh dump. Run 'melos run schema:dump' and commit the result."
                diff "$committed" "$fresh" || true
                fail=1
              fi
            done
          done
          exit "$fail"
      - name: Bundle generated sources
        run: |
          find . \( -name '*.g.dart' -o -name '*.freezed.dart' \
                    -o -name '*.config.dart' -o -name '*.mocks.dart' \
                    -o -name '*_localizations*.dart' \) \
            -not -path '*/.dart_tool/*' -print0 \
            | tar --null -czf "$RUNNER_TEMP/generated.tar.gz" -T -
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}/generated.tar.gz
          retention-days: 1

  # ── Static analysis ─────────────────────────────────────────────
  # One root `dart analyze .` walks every workspace member and honours
  # each package's own analysis_options.yaml. Needs generated code, so
  # it restores the artifact from `generate` first.
  #
  # --fatal-infos because infos were invisible to every gate before
  # #158: `dart analyze` exits 0 on them, so three
  # unintended_html_in_doc_comment infos sat in core/observability
  # unnoticed and had to be re-triaged as "known" each time anyone
  # looked. The workspace is clean at this level, so keep it that way —
  # if a new info is genuinely acceptable, silence it at the source with
  # an `// ignore:` and a reason rather than reopening the gate.
  analyze:
    name: Analyze
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: Analyze whole workspace
        run: dart analyze --fatal-infos .

  # ── Discover packages that have tests ───────────────────────────
  # Builds the test matrix dynamically so new packages are picked up
  # automatically — nothing to keep in sync by hand.
  discover-tests:
    name: Discover test packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: find
        run: |
          pkgs=$(find packages apps -type d -name test -not -path '*/.*/*' \
            | sed 's:/test$::' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Discovered test packages: $pkgs"

  # ── Tests (one job per package, in parallel) ────────────────────
  # `flutter test` for every package — drift_storage's suites import
  # flutter_test, so `dart test` can't run them, and `flutter test`
  # runs pure-Dart suites cleanly too. Restores generated code first.
  # fail-fast off so one red package doesn't cancel the rest.
  #
  # Goldens (#32) are EXCLUDED here (`--exclude-tags golden`) because the
  # `goldens` job runs them, in the golden container that renders the
  # committed baselines (#159). On the runner itself they would compare
  # one host's anti-aliasing against another's.
  test:
    name: Test ${{ matrix.package }}
    needs: [generate, discover-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-tests.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: flutter test
        working-directory: ${{ matrix.package }}
        run: flutter test --coverage --exclude-tags golden --test-randomize-ordering-seed random
      # ── Coverage → Codecov ──────────────────────────────────────────
      # `flutter test` writes lcov paths relative to the PACKAGE
      # (`SF:lib/src/...`), and nearly every package has a `lib/src/`, so
      # uploaded as-is they collide and Codecov cannot place them. The
      # package dir is prefixed here, per report — codecov.yml `fixes:`
      # rewrite repo-wide and cannot tell one package's upload from
      # another's.
      #
      # The flag is the package path minus `packages/`, slashes → dashes
      # (Codecov flags allow only [\w.-], max 45). The path rather than
      # the dir name keeps flags unique as packages are added, and
      # `platform-web` says more than `web`. That holds only while no dir
      # name has a dash of its own (`a-b/c` and `a/b-c` would share a
      # flag), so the step below enforces it and the length, failing
      # loudly rather than letting Codecov reject or merge an upload
      # behind the non-fatal step. Flag config and ignores live in
      # codecov.yml.
      #
      # Four blind spots, measured on 2026-11-05 and accepted in #400. The
      # first two and the last leave code out of the report rather than
      # counting it uncovered, so the totals read HIGHER than the truth;
      # the third mostly reads LOWER:
      #   - Unimported files. A file no test imports is absent from lcov
      #     entirely. Of the 165 VM-side files absent then, four held any
      #     logic: home_placeholder_screen.dart (dead, #195),
      #     image_host.dart (test support), and the small
      #     sync_operation_sender.dart and active_server_scope.dart. The
      #     rest were barrels, interfaces and constants.
      #   - Browser-only code. What only the `test-web` suites reach is
      #     absent too: `flutter test --platform chrome --coverage` writes
      #     an empty report on the pinned Flutter, so that job does not
      #     upload (#731).
      #   - Coverage is per package. A package's report counts only its
      #     own suites, so lines in `core/interfaces` that only other
      #     packages' tests exercise read as uncovered, or the whole file
      #     reads as absent when no suite of its own imports it.
      #   - Packages with no `test/` directory never upload: the apps and
      #     `platform/desktop` and `platform/mobile`, about 70 lines.
      # One skew runs the other way: goldens are excluded above, and the
      # `goldens` job uploads no coverage, so golden-only widget code
      # reads low.
      - name: Prefix coverage paths with the package dir
        id: coverage
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          rel="${PACKAGE#packages/}"
          if [[ ! "$rel" =~ ^[A-Za-z0-9_/]+$ ]]; then
            echo "::error::$PACKAGE: use only [A-Za-z0-9_] in dir names; its Codecov flag could collide with another package's."
            exit 1
          fi
          flag="${rel//\//-}"
          if (( ${#flag} > 45 )); then
            echo "::error::$PACKAGE: Codecov flag '$flag' is ${#flag} chars; the limit is 45."
            exit 1
          fi
          report="$PACKAGE/coverage/lcov.info"
          # A package whose every test is excluded here (golden-only, or
          # browser-only) has no report. Not an error — just nothing to send.
          if [ ! -s "$report" ]; then
            echo "::notice::No coverage report for $PACKAGE; skipping upload."
            echo "report=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|^SF:|SF:$PACKAGE/|" "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
      # Not fatal: a Codecov outage should not turn a green test run red.
      # Fork PRs have no access to the token and upload tokenless, which
      # Codecov accepts for public repos.
      - name: Upload coverage
        if: steps.coverage.outputs.report != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ steps.coverage.outputs.report }}
          disable_search: true
          flags: ${{ steps.coverage.outputs.flag }}
          name: ${{ steps.coverage.outputs.flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Browser tests (#288) ─────────────────────────────────────
  # Some suites cannot run on the VM at all: `package:drift/wasm.dart`
  # reaches `dart:js_interop`, so `web_storage`'s entire lib — and
  # `web_platform`'s storage composition — is uncompilable there. Those
  # files carry `@TestOn('browser')`, which means the `test` job above
  # SKIPS them (a platform-mismatched file is excluded before compile);
  # this job is where they actually run.
  #
  # Note the packages are listed rather than discovered. `discover-tests`
  # finds test *directories*, and every package here also has VM suites in
  # the same directory — so this is not "the packages the other job
  # can't do", it is "the packages that additionally need a browser".
  # Add one when it grows its first browser suite.
  #
  # Mirrors `melos run test:web`. Kept as its own job (not a matrix
  # dimension of `test`) because it needs Chrome and the fetched wasm
  # assets, and neither belongs in the 28-package matrix.
  test-web:
    name: Browser test ${{ matrix.package }}
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/storage/web_storage
          - packages/platform/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      # The wasm binaries are versioned artifacts of the drift release and
      # are gitignored (#288), so CI fetches them like a developer does.
      # Runs before the test, and fails the job if the pinned release no
      # longer matches the resolved `drift` version.
      - name: Fetch drift/wasm assets
        run: dart run tool/fetch_web_assets.dart
      # `flutter test --platform chrome` needs a browser and does not
      # install one. GitHub's ubuntu image ships Chrome, but naming a path
      # blindly turns a missing browser into a confusing driver error, so
      # resolve it here and fail with a sentence instead.
      - name: Locate Chrome
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "CHROME_EXECUTABLE=$(command -v "$candidate")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::No Chrome/Chromium on this runner. The browser suites (#288) need one; install it in this job or pin a runner image that ships it."
          exit 1
      - name: flutter test --platform chrome
        working-directory: ${{ matrix.package }}
        run: flutter test --platform chrome --test-randomize-ordering-seed random

  # ── Web build (#418) ─────────────────────────────────────────────
  # Builds the web app the way #418 publishes it, on every PR. Before this
  # job, none built an app, so a change could break the release build and
  # every check would stay green. `build-android` does the same for the
  # Android APK (#51); desktop and iOS have no build job yet (#785).
  #
  # The fetch, then tool/build_web.dart, the same two steps
  # `melos run build-web` runs: the `format_workspace.dart` arrangement, so
  # the build has one definition. The script empties the output, builds
  # with the published flags, removes the tooling dotfiles, fails on any
  # other dotfile, and requires the files the app boots from. `publish-web`
  # builds its image from this job's artifact, so the files checked here
  # are the files that ship.
  build-web:
    name: Web build
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      # Each file is checked against its committed SHA-256 before it is
      # placed, and a mismatch fails the step.
      - name: Fetch drift/wasm assets
        run: dart run tool/fetch_web_assets.dart
      # The build sorts one map Flutter writes in directory order, so that
      # builds of one commit hold the same files. Its fixtures run first.
      - name: Web build self-test
        run: dart run tool/build_web.dart --self-test
      - name: Build the web app as it ships
        run: dart run tool/build_web.dart
      # Only `publish-web` reads this, so only a run that publishes uploads
      # it: the same condition as that job's `if:`. It is kept a week, so
      # "Re-run failed jobs" can still retry a failed publish after a
      # weekend. After that, "Re-run all jobs" builds it again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: web-build
          path: apps/browser/build/web
          retention-days: 7
          if-no-files-found: error

  # ── Android build (#51) ──────────────────────────────────────────
  # The release build `melos run build-mobile-android` runs:
  # tool/build_android.dart builds one universal APK, checks its package,
  # its INTERNET permission and its signer, and writes it beside its
  # checksum. It runs on every PR and master push until there is a stable
  # release, when #790 moves it to master and a nightly run.
  #
  # Always with the debug key. This job never names the release key or
  # its environment, so nothing a PR changes here can reach them;
  # `release-android` below signs.
  build-android:
    name: Android build
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: ./.github/actions/setup-android
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: Android build self-test
        run: dart run tool/build_android.dart --self-test
      - name: Build the APK with the debug key
        run: dart run tool/build_android.dart

  # ── Gates (#419) ─────────────────────────────────────────────────
  # Every test gate, in one list. `release-android`, `release` and
  # `publish-web` each need this job rather than copying the list, so a new
  # gate is added here once and holds all three back. It does nothing but
  # wait: a gate that fails or is skipped skips it, and with it the three.
  gates:
    name: Gates
    needs: [constraints, palette, goldens, format, test-files, generate, analyze, test, test-web, build-web, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Every gate passed."

  # ── Android release (#51) ────────────────────────────────────────
  # Signs master's APK with the release key and uploads it with its
  # checksum, as the 7-day `android-apk` artifact, not a release (#785
  # owns releases). Only a push to master in this repository runs it, so
  # a fork's master builds in `build-android` and uploads nothing.
  #
  # The key's four secrets live in the `android-release` environment,
  # which only master may deploy to. GitHub hands a job an environment's
  # secrets only once its branch rule passes, so a job from any other
  # ref can't read them, even one that edits this file to name the
  # environment. docs/dev/android-signing.md sets it up.
  #
  # It waits for every gate (`gates`), as `publish-web` does, so an APK
  # testers install is from a tested commit, as the web image is. Not in
  # `publish-web`'s `needs:`: `build-android` is the gate, and a signing
  # problem shouldn't hold back the web image.
  release-android:
    name: Android release
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'BoardGamesEmpire/board-games-empire-client'
    environment: android-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-sources
          path: ${{ runner.temp }}
      - name: Restore generated sources
        run: tar -xzf "$RUNNER_TEMP/generated.tar.gz"
      - uses: ./.github/actions/setup-android
      - uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        run: flutter pub get
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The android-release environment's ANDROID_KEYSTORE_BASE64 secret is empty or unset, so master cannot sign the APK. docs/dev/android-signing.md sets it."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # A missing password or alias secret reaches Gradle as an empty
      # variable, and Gradle fails on a partly configured key rather than
      # fall back to the debug one.
      - name: Build the APK with the release key
        env:
          BGE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          BGE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BGE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BGE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: dart run tool/build_android.dart --require-release-signing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: apps/mobile/build/release
          retention-days: 7
          if-no-files-found: error
      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # ── Release (#419) ───────────────────────────────────────────────
  # Runs semantic-release on every master push, so a merged `feat` or
  # `fix` is released without anyone editing a version. When the commits
  # since the last `v*` tag call for a release, it rewrites the four
  # pubspecs, commits `chore(release): X.Y.Z` straight to master and tags
  # `vX.Y.Z`. CONTRIBUTING.md, Releasing, has the rules.
  #
  # The push uses a GitHub App token, not `GITHUB_TOKEN`: a push made with
  # `GITHUB_TOKEN` starts no workflow, and the release commit's own run is
  # the release build. It builds and publishes with the new version, which
  # is why nothing else here builds a release. The App, its variable and
  # its secret live in the `release` environment, which only master may
  # deploy to (#826).
  #
  # A run behind master releases nothing: semantic-release stops when its
  # checkout is not the branch's tip, and the newer run's analysis covers
  # these commits as well as its own. `queue: max` lets every run take its
  # turn, so none is cancelled for a newer one. A merge that lands while
  # this job runs makes its push fail, as a non-fast-forward, and leaves
  # that run red; the next run releases both merges.
  #
  # Until a `v*` tag exists there is nothing to count commits from, so the
  # job does nothing; the first release is tagged by hand.
  #
  # It waits for every gate (`gates`): a release is cut from a tested
  # commit. Nothing depends on this job.
  release:
    name: Release
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'BoardGamesEmpire/board-games-empire-client'
    environment: release
    concurrency:
      group: bge-client-release
      queue: max
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # The App token does the pushing, so the checkout keeps no
      # credentials. Full history and tags: semantic-release reads them.
      # The guard matches only version tags: semantic-release ignores a
      # `vnext` or `v1.2`, so with only those it would find no release and
      # cut its default first one, 1.0.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for a release tag
        id: guard
        run: |
          set -euo pipefail
          if [ -z "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "::notice::No vX.Y.Z tag yet. The first release, v0.1.0, is tagged by hand (CONTRIBUTING.md, Releasing)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the App credentials
        if: steps.guard.outputs.skip != 'true'
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::The release environment's RELEASE_APP_CLIENT_ID variable or RELEASE_APP_PRIVATE_KEY secret is empty or unset, so this job cannot push the release commit. #826 creates the App and sets both."
            exit 1
          fi
      # The prepare step runs `dart run tool/check_sdk_constraints.dart`,
      # which needs the workspace resolved.
      - if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/setup-flutter
      - name: Resolve workspace
        if: steps.guard.outputs.skip != 'true'
        run: flutter pub get
      - name: Create the App token
        id: app-token
        if: steps.guard.outputs.skip != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # No package.json: `npx -p` installs the pinned packages for this run
      # only. Renovate keeps the versions current (#419). The commit's
      # author is the App's bot user, whose id the noreply address needs.
      - name: Release with semantic-release
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          export GIT_AUTHOR_NAME="${SLUG}[bot]"
          export GIT_COMMITTER_NAME="${SLUG}[bot]"
          export GIT_AUTHOR_EMAIL="${id}+${SLUG}[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="${id}+${SLUG}[bot]@users.noreply.github.com"
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/exec@7.1.0 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@10.4.1 \
            semantic-release

  # ── Publish the web image (#418) ─────────────────────────────────
  # Pushes `build-web`'s files as ghcr.io/boardgamesempire/bge-client-web,
  # the image the backend copies its bundled client from. Only a push to
  # master publishes, after every gate above has passed, so a published
  # commit is a tested one: it needs `gates`, which lists them.
  #
  # `sha-<short>` names one commit and never moves. `edge` holds the files
  # of master's newest published commit, and moves only when those files
  # change (#424), so its revision label names the commit that moved it,
  # normally the first to build them. There are no version tags yet
  # (#419). Three rules keep the tags honest:
  #   - The image is pushed by digest and checked before either tag points
  #     at it, so a failed check leaves both tags where they were.
  #   - `edge` only moves forward along master. Master runs do not cancel
  #     each other (top of this file), so an older commit's run can get
  #     here after a newer one's, and a re-run can get here at any time.
  #     The job runs one at a time across all of them, and its last step
  #     moves `edge` only for a commit that no newer published commit has
  #     overtaken. Every step before that is safe to repeat: nothing a tag
  #     points at changes until then.
  #   - A `sha-<short>` never moves. If one already names this commit, an
  #     earlier attempt pushed and checked it, and this one checks and tags
  #     that image instead of pushing another. If it names any other
  #     commit, the job stops.
  #
  # The image is one bare manifest: no index, provenance or SBOM. A default
  # push from a public repository attaches provenance, which wraps even a
  # single-platform image in an index, and an arm64 consumer of an
  # amd64-only index fails with "no match for platform in manifest". A bare
  # manifest copies on any platform. The check proves it on the two the
  # backend builds.
  #
  # The package is public, so the backend's source builds and Renovate
  # pull it without credentials. A public package cannot be made private
  # again.
  publish-web:
    name: Publish web image
    needs: [gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # One publish at a time, across every master run. The last step reads
    # the tags and then writes `edge`, which is safe only if no other run
    # can write in between: otherwise an older commit's run could look
    # before a newer one's tags, then write `edge` after it and move
    # `edge` back to the older image.
    # `queue: max` keeps up to 100 waiting jobs. By default a group holds
    # one pending job and cancels it when the next arrives, so re-running
    # an older commit's publish would cancel the tip's.
    concurrency:
      group: bge-client-web
      queue: max
    # Without this timeout, a stuck job would hold the queue for six hours.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/boardgamesempire/bge-client-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-build
          path: ${{ runner.temp }}/image/web
      # The version label carries what the app reports, and `created` the
      # commit's date rather than the build's (see the Dockerfile).
      #
      # `files` hashes the files this job pushes, the ones the check below
      # compares against: each file's path and SHA-256, sorted by path, then
      # hashed again. Paths, contents and nothing else, so the artifact's
      # reset mtimes and modes cannot change it. The tag step compares it
      # with `edge`'s.
      - name: Read the labels and the short SHA
        id: meta
        run: |
          set -euo pipefail
          version=$(jq -er .version "$RUNNER_TEMP/image/web/version.json")
          created=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "$GITHUB_SHA")
          files=$(cd "$RUNNER_TEMP/image/web" \
            && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum)
          {
            echo "short=${GITHUB_SHA::7}"
            echo "version=$version"
            echo "created=$created"
            echo "files=sha256:${files%% *}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # A sha tag is written only after its image passed the check, so one
      # that names this commit is an earlier attempt's image, and the steps
      # below check and tag it again rather than push another. One naming
      # any other commit, a short-SHA collision or a hand-pushed tag, stops
      # the job.
      #
      # "not found" is a missing tag. 403 and "denied" mean this token
      # cannot read the package, which before the first push is because it
      # does not exist; a token that cannot read it cannot push to it either,
      # so going on can never overwrite anything. Any other failure stops
      # the job rather than guess.
      - name: Look for this commit's image from an earlier attempt
        id: existing
        env:
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          ref="$IMAGE:sha-$SHORT"
          if ! manifest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$RUNNER_TEMP/inspect.err"); then
            err=$(cat "$RUNNER_TEMP/inspect.err")
            case "$err" in
              *"not found"* | *"403 Forbidden"* | *denied*)
                echo "$ref is not published yet."
                exit 0 ;;
              *)
                echo "::error::Could not tell whether $ref exists: $err"
                exit 1 ;;
            esac
          fi
          digest=$(jq -er .digest <<<"$manifest")
          revision=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image.Config.Labels}}' \
            | jq -r '."org.opencontainers.image.revision" // empty')
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::$ref names ${revision:-an image with no revision label}, not $GITHUB_SHA, and sha tags never move."
            exit 1
          fi
          echo "::notice::An earlier attempt pushed $ref as $digest. This one checks and tags that image."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Push the image by digest, untagged
        id: push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: apps/browser/Dockerfile
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            CREATED=${{ steps.meta.outputs.created }}
            FILES=${{ steps.meta.outputs.files }}
      - name: Check the digest from amd64 and arm64
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          type=$(docker buildx imagetools inspect --raw "$ref" | jq -r .mediaType)
          case "$type" in
            *image.manifest* | *distribution.manifest.v2*) ;;
            *)
              echo "::error::$ref is a $type, not a single image manifest."
              exit 1 ;;
          esac
          # The backend's own move: COPY --from by digest, once per platform
          # it builds. The copied files must be exactly what build-web checked.
          check=$(mktemp -d)
          mkdir "$check/context"
          printf 'FROM scratch\nCOPY --from=%s /web /web\n' "$ref" > "$check/context/Dockerfile"
          for platform in linux/amd64 linux/arm64; do
            out="$check/${platform//\//-}"
            docker buildx build --platform "$platform" --output "type=local,dest=$out" "$check/context"
            diff -r "$RUNNER_TEMP/image/web" "$out/web"
            echo "::group::$platform: COPY --from copied $(find "$out/web" -type f | wc -l) files to /web"
            (cd "$out/web" && find . -type f | sort)
            echo "::endgroup::"
          done
      # No step before this one changes anything a consumer can see. This
      # one reads everything it decides on before it writes any tag. Then
      # it writes `sha-<short>`, for every commit that gets that far
      # (#424), and moves `edge` only if all of these hold:
      #   - The commit is on master: master's tip is the commit or a
      #     descendant of it.
      #   - No newer commit on master has a `sha-<short>`, the record of
      #     which commits have been published. An older commit's run that
      #     arrives late, or a re-run of one, leaves `edge` where it is, so
      #     `edge` never moves back. `edge`'s own revision label cannot
      #     decide this: it stays on an older commit for as long as the
      #     files do not change.
      #   - Its files differ from `edge`'s, or `edge` has no files label.
      # A run that fails while reading writes nothing, so its commit does
      # not count as published and cannot hold back an older one.
      # `sha-<short>` goes before `edge`, in a command of its own, so `edge`
      # never names a commit without one, which an older commit's run could
      # then move `edge` back from. The job's concurrency group keeps every
      # other run's write out of the gap between these reads and the
      # writes. --prefer-index=false copies the manifest under the new tag
      # as it is. Left to default, a single source is wrapped in a new
      # index.
      - name: Tag the checked digest, and move edge if it should
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
          SHORT: ${{ steps.meta.outputs.short }}
          FILES: ${{ steps.meta.outputs.files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          write_tag() {
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$1" "$IMAGE@$DIGEST"
            got=$(docker buildx imagetools inspect "$IMAGE:$1" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$1 points at $got, not $DIGEST."
              exit 1
            fi
          }
          # Whether commit $1 has a `sha-<short>`. One that names another
          # commit, a short-SHA collision, does not count.
          published() {
            local labels
            if labels=$(docker buildx imagetools inspect "$IMAGE:sha-${1::7}" --format '{{json .Image.Config.Labels}}' 2>"$RUNNER_TEMP/published.err"); then
              [ "$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")" = "$1" ]
            elif grep -qF "$IMAGE:sha-${1::7}: not found" "$RUNNER_TEMP/published.err"; then
              return 1
            else
              echo "::error::Could not tell whether $1 was published: $(cat "$RUNNER_TEMP/published.err")"
              exit 1
            fi
          }
          # Sets `move` to whether `edge` should move, and `reason` to why.
          decide() {
            tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              # GitHub's compare answers "ahead" when the tip descends from
              # this commit, and lists, oldest first, the commits the tip
              # has and this one lacks. A 404 means it no longer has this
              # commit.
              if ! pages=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$tip?per_page=100" \
                --jq '{status, commits: [.commits[].sha]}' 2>"$RUNNER_TEMP/compare.err"); then
                if ! grep -q 'HTTP 404' "$RUNNER_TEMP/compare.err"; then
                  echo "::error::Could not compare $GITHUB_SHA with master: $(cat "$RUNNER_TEMP/compare.err")"
                  exit 1
                fi
                pages='{"status": "missing", "commits": []}'
              fi
              if [ "$(jq -rs '.[0].status' <<<"$pages")" != ahead ]; then
                move=false reason="master's tip, \`$tip\`, does not contain this commit."
                return
              fi
              # Newest first: the newest are the likeliest to be published.
              while read -r commit; do
                if published "$commit"; then
                  move=false reason="\`$commit\`, a newer commit, was published first."
                  return
                fi
              done < <(jq -rs '[.[].commits[]] | reverse | .[]' <<<"$pages")
            fi
            if ! labels=$(docker buildx imagetools inspect "$IMAGE:edge" --format '{{json .Image.Config.Labels}}' 2>"$RUNNER_TEMP/edge.err"); then
              if ! grep -qF "$IMAGE:edge: not found" "$RUNNER_TEMP/edge.err"; then
                echo "::error::Could not read $IMAGE:edge: $(cat "$RUNNER_TEMP/edge.err")"
                exit 1
              fi
              move=true reason="there was no \`edge\`."
              return
            fi
            edge_revision=$(jq -r '."org.opencontainers.image.revision" // empty' <<<"$labels")
            edge_files=$(jq -r '."io.github.boardgamesempire.web.files" // empty' <<<"$labels")
            built_by=${edge_revision:-an unlabelled commit}
            if [ -z "$edge_files" ]; then
              move=true reason="\`edge\` had no files label."
            elif [ "$edge_files" = "$FILES" ]; then
              move=false reason="its files are this commit's, built by \`$built_by\`."
            else
              move=true reason="the files changed since \`$built_by\`."
            fi
          }

          decide
          write_tag "sha-$SHORT"
          echo "Published \`$IMAGE:sha-$SHORT\` as \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"
          if [ "$move" = true ]; then
            write_tag edge
            echo "::notice::edge moved to $DIGEST: ${reason//\`/}"
            echo "Moved \`$IMAGE:edge\` to \`$DIGEST\`: $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::edge stays where it is: ${reason//\`/}"
            echo "\`edge\` stays where it is: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

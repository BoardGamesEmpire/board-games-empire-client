name: board_games_empire
publish_to: none

# ── Toolchain pin (#153) ───────────────────────────────────────────
# `flutter:` below is an EXACT version, not a floor. It is the single
# source of truth for the toolchain: CI reads it directly with
# `flutter-version-file: pubspec.yaml` (subosito/flutter-action), so a
# workflow can no longer disagree with the pubspecs. Every Flutter
# package in the workspace declares `flutter: ">=<this version>"`, and
# `melos run check:constraints` fails the build if any drifts.
#
# `sdk:` is the Dart floor that pairs with it — Flutter 3.47.1 bundles
# Dart 3.13.1, and 3.47.0 was the first stable to ship Dart 3.13. The
# Flutter constraint is deliberately the tighter of the two so it does
# real work: `sdk: ^3.13.0` alone would still admit Flutter 3.47.0.
#
# To bump, edit both values here and run
#   dart run tool/check_sdk_constraints.dart --fix
# to propagate the floor to every package. Goldens (#32) run local-only,
# so also regenerate them (`melos run goldens:update`) and commit the
# refreshed `goldens/ci/` PNGs in the same PR.
#
# Trade-off of an exact pin: `flutter pub get` fails on any other
# Flutter version, newer stables included. That is the point — it makes
# toolchain moves deliberate rather than silent.
environment:
  sdk: ^3.13.0
  flutter: 3.47.1

# Selects the SQLite3MultipleCiphers build of SQLite for the entire
# workspace (apps *and* `flutter test` runs) via the sqlite3 3.x build hook.
# This is what provides encryption-at-rest (#16): EncryptedExecutorFactory
# applies `PRAGMA key` and verifies `PRAGMA cipher` support at every open.
# With pub workspaces this must live in the root pubspec, not per-app.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dev_dependencies:
  melos: ^8.5.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0
  build_runner: ^2.16.0
  # Read-only pubspec parsing for tool/check_sdk_constraints.dart (#153).
  yaml: ^3.1.2
  # tool/derive_palette.dart shares the OKLCH hue math, the sRGB transfer
  # function and the ember/error separation floor with `Oklch` (#172). The
  # imported entry point is Flutter-free so `dart run` can load it. `path:`
  # like every other in-repo consumer, and for a second reason here: on a
  # 0.0.x version `^0.0.1` means `>=0.0.1 <0.0.2`, so bumping ui_tokens
  # would break the root resolve.
  ui_tokens:
    path: packages/ui/tokens

workspace:
  - apps/mobile
  - apps/desktop
  - apps/browser
  - packages/app_shell
  - packages/core/interfaces
  - packages/core/models
  - packages/core/di
  - packages/core/observability
  - packages/features/auth
  - packages/features/feedback
  - packages/features/household
  - packages/features/server_onboarding
  - packages/storage/drift_storage
  - packages/storage/key_storage
  - packages/storage/storage_interface
  - packages/storage/memory_storage
  - packages/storage/web_storage
  - packages/network/dio_network
  - packages/network/network_interface
  - packages/network/web_network
  - packages/platform/mobile
  - packages/platform/desktop
  - packages/platform/native_platform
  - packages/platform/connectivity_platform
  - packages/platform/web
  - packages/testing/l10n
  - packages/ui/tokens
  - packages/ui/widgets

melos:
  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    # ── Staged generation (#33) ────────────────────────────────────
    # l10n FIRST: generated localizations are gitignored (regenerated,
    # never committed — no drift), and they must exist before the
    # build_runner pass per the established build ordering. A fresh
    # checkout must run `melos run generate` once before analyze/test.
    generate:
      run: melos run generate:i18n && melos run generate:build
      description: Full staged codegen — gen-l10n across i18n packages, then one workspace-wide build_runner pass.

    generate:i18n:
      run: melos exec -- flutter gen-l10n
      description: Generate localizations in every package that owns an l10n.yaml.
      packageFilters:
        fileExists: l10n.yaml

    # `--delete-conflicting-outputs` was removed in build_runner 2.16 —
    # passing it now only earns a "these options have been removed" warning.
    # The new build_runner deletes conflicting outputs on its own.
    generate:build:
      run: dart run build_runner build --workspace
      description: Run build_runner once across the entire workspace (single builder compile, parallel across packages).

    # ── Drift schema tooling (issues #52, #7) ──────────────────────
    schema:dump:
      run: melos exec -c 1 --scope="drift_storage" -- "flutter pub run drift_dev schema dump lib/src/databases/server_database.dart drift_schemas/server/ && flutter pub run drift_dev schema dump lib/src/databases/meta_database.dart drift_schemas/meta/"
      description: Refresh committed Drift schema snapshots for both databases. Run after any schema change, then commit the JSON.

    schema:migrations:
      run: melos exec -c 1 --scope="drift_storage" -- "flutter pub run drift_dev make-migrations"
      description: Generate step-by-step migration scaffolding + schema tests for all databases registered in build.yaml.

    # ── Toolchain constraint consistency (#153) ────────────────────
    # Guards against the drift this repo already had: `flutter: ">=3.0.0"`
    # left over from `flutter create` in 17 packages. pub can't catch it,
    # because the Dart floor already excludes every Flutter that low, so
    # the constraint never fails a resolve. CI runs this on every PR.
    check:constraints:
      run: dart run tool/check_sdk_constraints.dart
      description: Verify workspace pubspec invariants — sdk/flutter constraints match the root pin, and every pubspec declares publish_to none. Add --fix to propagate a toolchain bump.

    # ── Palette verification (#32, #192) ──────────────────────────
    # `bge_color_schemes.dart` is generated by tool/derive_palette.dart,
    # and the token tests check the emitted VALUES — not the script that
    # produced them. So of the two tool scripts in this repo one was
    # exercised by CI and the other by nobody: a broken verify mode would
    # have been found by the next human to regenerate the palette, which
    # is also the moment it is least useful. CI runs this on every PR.
    #
    # Run from a RESOLVED workspace, like the format scripts below: the
    # script shares the hue math and the separation floor with `Oklch`
    # over a package: URI (#172), so it needs package_config.json.
    check:palette:
      run: dart run tool/derive_palette.dart
      description: Re-derive the palette and check every contrast target and the ember/error hue separation. Exits 1 on failure. Requires a resolved workspace.

    # ── Formatting (#173) ─────────────────────────────────────────
    # The work is in tool/format_workspace.dart, not inline here, for the
    # same reason check:constraints delegates to a script: CI runs the
    # identical command, so the file-set rules live in exactly one place
    # without CI having to depend on melos. That script's header carries
    # the full reasoning — why the list comes from `git ls-files` rather
    # than a directory walk, and why it batches.
    #
    # Run these from a RESOLVED workspace. Formatting depends on
    # `formatter: trailing_commas: preserve`, which very_good_analysis
    # sets and which reaches the formatter through an `include:` on a
    # package: URI — unresolvable without .dart_tool/package_config.json.
    # Unresolved, that include silently falls back to `automate` and the
    # formatter starts joining calls whose trailing comma should have
    # pinned them open, so the SAME commit formats differently
    # (bge_typography.dart is the one file in the tree that shows it).
    # `melos bootstrap` has resolved locally; CI runs `flutter pub get`
    # before the check for exactly this reason. Note --language-version
    # does NOT substitute for the resolve — the divergence is the
    # trailing-comma mode, not the language version.
    #
    # Today only ui_tokens includes very_good_analysis; the other 27
    # packages include flutter_lints, which sets no formatter block and
    # so gets the default `automate`. The workspace is therefore
    # formatted under two different modes, and whichever way #194
    # settles that will require a reformat sweep like #173's.
    format:
      run: dart run tool/format_workspace.dart
      description: Format all tracked Dart source. Requires a resolved workspace (melos bootstrap).

    format:check:
      run: dart run tool/format_workspace.dart --check
      description: Fail if any tracked Dart source is unformatted (mirrors CI). Run `melos run format` to fix.

    # Analysis and testing
    analyze:
      run: melos exec -- flutter analyze .
      description: Run flutter analyze on all packages
      packageFilters:
        flutter: true

    # --fatal-infos to match `flutter analyze`, which treats infos as
    # fatal already. Without it the pure-Dart half of the workspace had
    # a weaker gate than the Flutter half, which is how #158's three
    # infos survived in core/observability. CI's root analyze passes the
    # same flag.
    analyze:dart:
      run: melos exec -- dart analyze --fatal-infos .
      description: Run dart analyze on pure-Dart packages (infos fatal, as in flutter analyze)
      packageFilters:
        flutter: false

    # --exclude-tags golden so this matches CI's test job exactly. Run
    # `test:goldens` for the golden check; see the golden block below.
    test:
      run: melos exec -c 4 -- "flutter test --coverage --exclude-tags golden --test-randomize-ordering-seed random"
      description: Run all non-golden tests in the workspace (mirrors CI).
      packageFilters:
        dirExists: test

    # ── Golden baselines (#32) ─────────────────────────────────────
    # Only test/**/goldens/ci/ is committed (Ahem-rendered, renderer
    # stable). The per-host test/**/goldens/<platform>/ variant is
    # disabled in each package's flutter_test_config.dart, because
    # alchemist compares it for real and its PNGs are gitignored — a
    # fresh clone would fail on a missing baseline rather than skip.
    #
    # `test:goldens` compares against the committed ci/ PNGs and so
    # works on a fresh clone. `goldens:update` rewrites them after an
    # *intended* visual change — commit only the ci/ PNGs. Neither runs
    # in CI, which excludes golden tags entirely; see #159 for closing
    # that gap.
    #
    # Both filter on test/goldens, i.e. packages that actually own
    # baselines (ui_tokens and ui/widgets today). A package with a test
    # dir but no golden-tagged tests does NOT no-op:
    # `flutter test --tags golden`
    # exits 79 ("no tests ran"), which melos reports as a failure. The
    # broader dirExists: test filter therefore failed in 21 of 22
    # packages — goldens:update had that bug from the start, and the
    # comment here used to claim exit 0.
    test:goldens:
      run: melos exec -c 1 -- "flutter test --tags golden"
      description: Compare golden-tagged tests against the committed test/**/goldens/ci/ baselines.
      packageFilters:
        dirExists: test/goldens

    goldens:update:
      run: melos exec -c 1 -- "flutter test --update-goldens --tags golden"
      description: Regenerate golden baselines after an intended visual change. Commit only test/**/goldens/ci/.
      packageFilters:
        dirExists: test/goldens

    # Clean and get dependencies
    clean:
      run: melos exec -- flutter clean && melos bootstrap
      description: Clean all packages and reinstall dependencies

    clean:generated:
      run: |
        find . -name "*.g.dart" -not -path "*/.dart_tool/*" -delete
        find . -name "*.freezed.dart" -not -path "*/.dart_tool/*" -delete
        find . -name "*.config.dart" -not -path "*/.dart_tool/*" -delete
        find . -path "*/lib/l10n/*_localizations*.dart" -not -path "*/.dart_tool/*" -delete
        find . -path "*/lib/l10n/untranslated.txt" -not -path "*/.dart_tool/*" -delete
        echo "Deleted all generated files."
      description: Delete all generated .g.dart / .freezed.dart / .config.dart files and generated localizations

    # Individual app runners
    web:
      run: melos exec -c 1 --scope="browser" -- "flutter run -d web-server --web-hostname=localhost --web-port=${BGE_WEB_PORT:-5000} --no-dds"
      description: "Serve the web app on a fixed port for the dev proxy (override with BGE_WEB_PORT; open the proxy origin, not this port)."

    web:proxy:
      run: node tool/dev_proxy/dev_proxy.mjs
      description: "Run the zero-dep dev reverse proxy (open http://localhost:8080). Ports: BGE_PROXY_PORT/BGE_WEB_PORT/BGE_BACKEND_PORT."

    web:server:
      run: 'node tool/dev_proxy/dev_proxy.mjs & PROXY_PID=$!; trap "kill $PROXY_PID 2>/dev/null" EXIT INT TERM; melos run web'
      description: "Run the proxy and web dev server together in one terminal (Ctrl-C stops both). Use the separate `web` + `web:proxy` scripts if you want independent logs."

    mobile:
      run: melos exec -c 1 -- flutter run
      description: Run the mobile application (requires connected device/emulator)
      packageFilters:
        scope: "mobile"

    desktop-windows:
      run: melos exec -c 1 -- flutter run -d windows
      description: Run the desktop application on Windows
      packageFilters:
        scope: "desktop"

    desktop-macos:
      run: melos exec -c 1 -- flutter run -d macos
      description: Run the desktop application on macOS
      packageFilters:
        scope: "desktop"

    desktop-linux:
      run: melos exec -c 1 -- flutter run -d linux
      description: Run the desktop application on Linux
      packageFilters:
        scope: "desktop"

      # Build commands for CI/CD
    build-web:
      run: melos exec -c 1 -- flutter build web --release --wasm
      description: Build the web application for production
      packageFilters:
        scope: "browser"

    build-mobile-android:
      run: melos exec -c 1 -- flutter build apk --release
      description: Build Android APK
      packageFilters:
        scope: "mobile"

    build-mobile-ios:
      run: melos exec -c 1 -- flutter build ios --release --no-codesign
      description: Build iOS application (no code signing for CI)
      packageFilters:
        scope: "mobile"

    build-desktop-windows:
      run: melos exec -c 1 -- flutter build windows --release
      description: Build Windows desktop application
      packageFilters:
        scope: "desktop"

    build-desktop-macos:
      run: melos exec -c 1 -- flutter build macos --release
      description: Build macOS desktop application
      packageFilters:
        scope: "desktop"

    build-desktop-linux:
      run: melos exec -c 1 -- flutter build linux --release
      description: Build Linux desktop application
      packageFilters:
        scope: "desktop"

    # Development utilities
    devices:
      run: flutter devices
      description: List all available devices

    doctor:
      run: flutter doctor
      description: Run Flutter doctor

    # Run all apps (requires multiple terminals or background processes)
    #
    # POSIX shell only — job control, `wait`, `case`, `uname`. It will not
    # run under cmd or PowerShell, so a Windows contributor should start
    # `web`, `mobile` and `desktop-windows` in separate terminals instead.
    # Not worth a Dart rewrite for an experimental convenience script
    # while `clean:generated` (find) and `web:server` (trap, job control)
    # carry the same assumption; if that assumption is ever lifted, lift
    # it across all three rather than here alone.
    #
    # There is no `desktop` script — only desktop-macos/-linux/-windows —
    # so this dispatches on the host. It used to call `melos run desktop`
    # and fail on that leg every time.
    #
    # `melos run web` serves the raw dev server; the cookie-bearing
    # origin is the proxy (`melos run web:proxy`), which this does not
    # start. See docs/dev/web-proxy.md.
    run-all:
      run: |
        echo "Starting all applications..."
        echo "Web dev server: http://localhost:${BGE_WEB_PORT:-5000} (run web:proxy separately for the real origin)"
        echo "Note: Mobile and Desktop require connected devices"
        melos run web &
        melos run mobile &
        case "$(uname -s)" in
          Darwin) melos run desktop-macos & ;;
          Linux) melos run desktop-linux & ;;
          *) melos run desktop-windows & ;;
        esac
        wait
      description: Run all applications simultaneously (experimental; POSIX shell only)

    build-all:
      run: |
        echo "Building all platforms..."
        melos run build-web
        melos run build-mobile-android
        melos run build-desktop-windows
        melos run build-desktop-macos
        melos run build-desktop-linux
      description: Build all platforms (requires appropriate OS)
